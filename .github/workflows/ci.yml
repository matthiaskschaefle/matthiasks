name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Lint, formatting, image manifest, production build, unit tests, and the
      # browser smoke test under the production Content Security Policy.
      - run: npm run verify
        env:
          CHROME_PATH: /usr/bin/google-chrome
